<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloxorz (Original) — SFG Web Games</title>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;
    background:#080000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:'Courier New',monospace;
    overflow:hidden;
  }

  /* scanlines */
  body::after{
    content:'';
    position:fixed;inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.15) 3px,rgba(0,0,0,.15) 4px);
    pointer-events:none;
    z-index:999;
  }

  #label{
    color:#FFB300;
    font-size:10px;
    letter-spacing:4px;
    text-transform:uppercase;
    text-shadow:0 0 8px #FF8C00;
    margin-bottom:10px;
    animation:blink 3s step-end infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}

  #ruffle-wrap{
    width:100%;
    max-width:640px;
    aspect-ratio:4/3;
    border:3px solid #FFB300;
    box-shadow:0 0 20px #FF6600,inset 0 0 10px #000;
    position:relative;
    background:#000;
  }

  ruffle-player{
    width:100%;
    height:100%;
    display:block;
  }

  #loading-msg{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:14px;
    color:#FFB300;
    font-size:11px;
    letter-spacing:3px;
  }
  .load-bar{
    width:180px;height:5px;
    background:#1A0000;
    border:1px solid #8B0000;
  }
  .load-fill{
    height:100%;
    background:#FFB300;
    box-shadow:0 0 8px #FFB300;
    animation:lf 1.6s ease-out forwards;
  }
  @keyframes lf{from{width:0}to{width:100%}}

  #err-msg{
    display:none;
    position:absolute;inset:0;
    flex-direction:column;
    align-items:center;justify-content:center;
    gap:10px;
    color:#f44;
    font-size:9px;
    letter-spacing:2px;
    text-align:center;
    padding:20px;
  }
  #err-msg span{font-size:28px}
</style>
</head>
<body>

<div id="label">▸ BLOXORZ — CLASSIC (2007) ◂</div>

<div id="ruffle-wrap">
  <!-- Loading indicator, hidden once Ruffle starts -->
  <div id="loading-msg">
    <div>LOADING FLASH EMULATOR...</div>
    <div class="load-bar"><div class="load-fill"></div></div>
    <div style="font-size:8px;color:#555;letter-spacing:2px">POWERED BY RUFFLE</div>
  </div>

  <!-- Error fallback -->
  <div id="err-msg">
    <span>⚠</span>
    COULD NOT LOAD GAME<br><br>
    MAKE SURE YOU ARE CONNECTED<br>TO THE INTERNET FOR RUFFLE TO LOAD.<br><br>
    <span style="font-size:9px;color:#555">Bloxorz.swf must be in this folder.</span>
  </div>
</div>

<script>
window.addEventListener('load', function() {
  var loading = document.getElementById('loading-msg');
  var errMsg  = document.getElementById('err-msg');
  var wrap    = document.getElementById('ruffle-wrap');

  // Give Ruffle a moment to initialise
  var waited = 0;
  var check = setInterval(function() {
    waited += 200;
    if (window.RufflePlayer && window.RufflePlayer.newest) {
      clearInterval(check);
      startRuffle();
    } else if (waited > 10000) {
      clearInterval(check);
      loading.style.display = 'none';
      errMsg.style.display  = 'flex';
    }
  }, 200);

  function startRuffle() {
    var ruffle = window.RufflePlayer.newest();
    var player = ruffle.createPlayer();
    player.style.width  = '100%';
    player.style.height = '100%';
    player.style.display = 'block';
    wrap.appendChild(player);
    loading.style.display = 'none';

    player.load('Bloxorz.swf').catch(function(e) {
      console.error('Ruffle load error:', e);
      errMsg.style.display = 'flex';
    });
  }
});
</script>
</body>
</html>
