from pathlib import Path

html = r'''<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory Index</title>

    <style>
        :root {
            color-scheme: dark;
            --bg: #101216;
            --panel: #181b21;
            --panel-hover: #20242c;
            --border: #2a2f38;
            --text: #f2f4f7;
            --muted: #9ca5b3;
            --accent: #69a7ff;
            --accent-hover: #8abaff;
            --folder: #ffd76a;
            --file: #b8c2d1;
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(105, 167, 255, 0.08), transparent 30%),
                var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .page {
            width: min(1100px, calc(100% - 32px));
            margin: 32px auto;
        }

        .header {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px 24px;
            box-shadow: var(--shadow);
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: 25px;
            font-weight: 650;
        }

        .subtitle {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        input,
        button {
            font: inherit;
        }

        input {
            flex: 1 1 260px;
            min-width: 0;
            padding: 11px 13px;
            color: var(--text);
            background: #11141a;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            padding: 10px 14px;
            color: var(--text);
            background: #20242c;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #282d36;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 18px 2px 12px;
            color: var(--muted);
            font-size: 14px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
        }

        .breadcrumb a {
            color: var(--accent);
            text-decoration: none;
        }

        .breadcrumb a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .listing {
            overflow: hidden;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .list-header,
        .entry {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 150px 180px;
            gap: 18px;
            align-items: center;
        }

        .list-header {
            padding: 13px 18px;
            border-bottom: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .entry {
            padding: 13px 18px;
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px solid rgba(42, 47, 56, 0.65);
            transition: background 0.12s ease;
        }

        .entry:last-child {
            border-bottom: 0;
        }

        .entry:hover {
            background: var(--panel-hover);
        }

        .name {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .icon {
            width: 22px;
            min-width: 22px;
            text-align: center;
            font-size: 19px;
        }

        .icon.folder {
            color: var(--folder);
        }

        .icon.file {
            color: var(--file);
        }

        .filename {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .type,
        .date {
            color: var(--muted);
            font-size: 13px;
        }

        .empty {
            display: none;
            padding: 36px 18px;
            color: var(--muted);
            text-align: center;
        }

        .footer {
            padding: 14px 2px 0;
            color: var(--muted);
            font-size: 12px;
        }

        @media (max-width: 760px) {
            .page {
                width: min(100% - 18px, 1100px);
                margin: 10px auto;
            }

            .header,
            .listing {
                border-radius: 12px;
            }

            .list-header {
                display: none;
            }

            .entry {
                grid-template-columns: minmax(0, 1fr) 82px;
                gap: 10px;
            }

            .date {
                display: none;
            }

            .type {
                text-align: right;
            }
        }
    </style>
</head>

<body>
<div class="page">

    <section class="header">
        <div class="title-row">
            <div>
                <h1>Directory Index</h1>
                <p class="subtitle">Browse files and folders</p>
            </div>
        </div>

        <div class="controls">
            <input id="search" type="search" placeholder="Search this folder..." aria-label="Search files and folders">
            <button id="sortButton" type="button">Sort: Name</button>
        </div>
    </section>

    <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="./">Home</a>
        <span>/</span>
        <span>Current Folder</span>
    </nav>

    <section class="listing">
        <div class="list-header">
            <div>Name</div>
            <div>Type</div>
            <div>Last Modified</div>
        </div>

        <div id="entries"></div>

        <div id="empty" class="empty">
            No files or folders match your search.
        </div>
    </section>

    <div class="footer" id="count"></div>
</div>

<script>
    /*
        Add the files/folders that exist beside this index.html here.

        Folders:
            { name: "Folder Name", href: "Folder-Name/", kind: "folder" }

        Files:
            { name: "example.zip", href: "example.zip", kind: "file", type: "ZIP", modified: "2026-10-06" }

        IMPORTANT:
        A normal static HTML page cannot automatically read the server's directory
        and discover every file. The server (or a small script) must generate this
        "entries" array, or you can maintain it manually.
    */

    const entries = [
        // Example:
        // { name: "Downloads", href: "Downloads/", kind: "folder" },
        // { name: "Readme.txt", href: "Readme.txt", kind: "file", type: "TXT", modified: "2026-10-06" },
        // { name: "archive.zip", href: "archive.zip", kind: "file", type: "ZIP", modified: "2026-10-06" },
    ];

    const entryContainer = document.getElementById("entries");
    const emptyMessage = document.getElementById("empty");
    const count = document.getElementById("count");
    const search = document.getElementById("search");
    const sortButton = document.getElementById("sortButton");

    let sortAscending = true;

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function getType(entry) {
        if (entry.kind === "folder") {
            return "Folder";
        }

        if (entry.type) {
            return entry.type.toUpperCase();
        }

        const dot = entry.name.lastIndexOf(".");
        return dot > 0 ? entry.name.slice(dot + 1).toUpperCase() : "File";
    }

    function render() {
        const query = search.value.trim().toLowerCase();

        const filtered = entries
            .filter(entry => entry.name.toLowerCase().includes(query))
            .sort((a, b) => {
                const aFolder = a.kind === "folder";
                const bFolder = b.kind === "folder";

                // Keep folders above files, similar to many directory listings.
                if (aFolder !== bFolder) {
                    return aFolder ? -1 : 1;
                }

                const result = a.name.localeCompare(b.name, undefined, {
                    numeric: true,
                    sensitivity: "base"
                });

                return sortAscending ? result : -result;
            });

        entryContainer.innerHTML = "";

        for (const entry of filtered) {
            const link = document.createElement("a");
            link.className = "entry";
            link.href = entry.href || "#";

            const icon = entry.kind === "folder" ? "📁" : "📄";
            const modified = entry.modified || "—";

            link.innerHTML = `
                <div class="name">
                    <span class="icon ${entry.kind === "folder" ? "folder" : "file"}">${icon}</span>
                    <span class="filename">${escapeHtml(entry.name)}</span>
                </div>
                <div class="type">${escapeHtml(getType(entry))}</div>
                <div class="date">${escapeHtml(modified)}</div>
            `;

            entryContainer.appendChild(link);
        }

        emptyMessage.style.display = filtered.length === 0 ? "block" : "none";

        const total = entries.length;
        const shown = filtered.length;
        count.textContent = `${shown} shown · ${total} total`;
    }

    search.addEventListener("input", render);

    sortButton.addEventListener("click", () => {
        sortAscending = !sortAscending;
        sortButton.textContent = `Sort: Name ${sortAscending ? "↑" : "↓"}`;
        render();
    });

    render();
</script>

</body>
</html>
'''

path = Path("/mnt/data/index.html")
path.write_text(html, encoding="utf-8")
print(path)
