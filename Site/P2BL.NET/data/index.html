<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Directory</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f3f4f6;
            color: #202124;
        }

        .window {
            width: min(1100px, calc(100% - 30px));
            margin: 30px auto;
            background: #ffffff;
            border: 1px solid #d5d9df;
            border-radius: 10px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .titlebar {
            padding: 16px 20px;
            background: #fafafa;
            border-bottom: 1px solid #e2e5e9;
        }

        .title {
            font-size: 20px;
            font-weight: 600;
        }

        .subtitle {
            margin-top: 4px;
            color: #6b7280;
            font-size: 13px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: #f8f9fa;
            border-bottom: 1px solid #e2e5e9;
        }

        .button {
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 6px;
            padding: 7px 11px;
            cursor: pointer;
            font-size: 13px;
        }

        .button:hover {
            background: #f1f3f5;
        }

        .path {
            flex: 1;
            min-width: 0;
            padding: 7px 10px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            color: #555;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .search {
            width: 220px;
            padding: 7px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
        }

        .search:focus {
            border-color: #8aa4c8;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th {
            text-align: left;
            padding: 10px 14px;
            background: #fafafa;
            border-bottom: 1px solid #e2e5e9;
            color: #6b7280;
            font-size: 12px;
            font-weight: 600;
        }

        .table td {
            padding: 10px 14px;
            border-bottom: 1px solid #edf0f2;
            font-size: 14px;
        }

        .table tr.item {
            cursor: pointer;
        }

        .table tr.item:hover {
            background: #f5f8fc;
        }

        .name-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            width: 24px;
            text-align: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .name {
            color: #1f2937;
            text-decoration: none;
        }

        .name:hover {
            text-decoration: underline;
        }

        .folder .name {
            font-weight: 500;
        }

        .muted {
            color: #6b7280;
        }

        .footer {
            padding: 10px 14px;
            color: #6b7280;
            font-size: 12px;
            background: #fafafa;
        }

        @media (max-width: 750px) {
            .toolbar {
                flex-wrap: wrap;
            }

            .path {
                width: 100%;
                flex-basis: 100%;
                order: 3;
            }

            .search {
                flex: 1;
                width: auto;
            }

            .table th:nth-child(3),
            .table td:nth-child(3),
            .table th:nth-child(4),
            .table td:nth-child(4) {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="window">

    <div class="titlebar">
        <div class="title">File Directory</div>
        <div class="subtitle">Files and folders in this directory</div>
    </div>

    <div class="toolbar">

        <button class="button" onclick="goUp()">↑ Up</button>

        <button class="button" onclick="location.reload()">↻ Refresh</button>

        <div class="path" id="currentPath">/</div>

        <input
            type="text"
            class="search"
            id="searchBox"
            placeholder="Search files..."
            oninput="renderFiles()"
        >

    </div>

    <table class="table">

        <thead>
            <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Size</th>
                <th>Modified</th>
            </tr>
        </thead>

        <tbody id="fileList"></tbody>

    </table>

    <div class="footer" id="footer">
        Loading...
    </div>

</div>

<script>

    /*
        ============================================================
        FILE LIST
        ============================================================

        Add your files and folders here.

        type:
            "folder" = directory
            "file"   = normal file

        size:
            Used for files. Leave empty for folders.

        modified:
            Optional modified date.

        href:
            Where clicking the item should go.
    */

    const FILES = [

        {
            name: "Downloads",
            type: "folder",
            size: "",
            modified: "",
            href: "./Downloads/"
        },

        {
            name: "Resources",
            type: "folder",
            size: "",
            modified: "",
            href: "./Resources/"
        },

        {
            name: "HostDownloads.GL",
            type: "file",
            size: "12 KB",
            modified: "2026-10-06",
            href: "./HostDownloads.GL"
        },

        {
            name: "BuildHashes.GL",
            type: "file",
            size: "8 KB",
            modified: "2026-10-06",
            href: "./BuildHashes.GL"
        },

        {
            name: "README.txt",
            type: "file",
            size: "4 KB",
            modified: "2026-10-05",
            href: "./README.txt"
        }

    ];


    /*
        ============================================================
        DIRECTORY PATH
        ============================================================
    */

    document.getElementById("currentPath").textContent =
        window.location.pathname;


    /*
        ============================================================
        FILE ICON
        ============================================================
    */

    function getIcon(item) {

        if (item.type === "folder") {
            return "📁";
        }

        const ext = item.name.split(".").pop().toLowerCase();

        switch (ext) {

            case "txt":
                return "📄";

            case "json":
                return "📋";

            case "html":
            case "htm":
                return "🌐";

            case "zip":
            case "7z":
            case "rar":
                return "📦";

            case "gl":
                return "🔷";

            case "exe":
                return "⚙️";

            case "dll":
                return "🔧";

            case "png":
            case "jpg":
            case "jpeg":
            case "gif":
            case "webp":
                return "🖼️";

            default:
                return "📄";
        }
    }


    /*
        ============================================================
        FORMAT FILE SIZE
        ============================================================
    */

    function formatSize(size) {
        return size || "—";
    }


    /*
        ============================================================
        RENDER LIST
        ============================================================
    */

    function renderFiles() {

        const list = document.getElementById("fileList");
        const footer = document.getElementById("footer");
        const search =
            document.getElementById("searchBox").value.toLowerCase();

        list.innerHTML = "";

        let filtered = FILES.filter(item =>
            item.name.toLowerCase().includes(search)
        );

        /*
            Folders always appear before files.
        */

        filtered.sort((a, b) => {

            if (a.type === "folder" && b.type !== "folder")
                return -1;

            if (a.type !== "folder" && b.type === "folder")
                return 1;

            return a.name.localeCompare(b.name);
        });


        /*
            Create table rows.
        */

        filtered.forEach(item => {

            const row = document.createElement("tr");

            row.className =
                "item " +
                (item.type === "folder" ? "folder" : "file");


            row.onclick = function () {

                if (item.href) {
                    window.location.href = item.href;
                }

            };


            row.innerHTML = `

                <td>
                    <div class="name-cell">
                        <div class="icon">
                            ${getIcon(item)}
                        </div>

                        <span class="name">
                            ${item.name}
                        </span>
                    </div>
                </td>

                <td class="muted">
                    ${item.type === "folder" ? "Folder" : getFileType(item.name)}
                </td>

                <td class="muted">
                    ${formatSize(item.size)}
                </td>

                <td class="muted">
                    ${item.modified || "—"}
                </td>

            `;


            list.appendChild(row);

        });


        footer.textContent =
            filtered.length +
            " item" +
            (filtered.length === 1 ? "" : "s");

    }


    /*
        ============================================================
        FILE TYPE
        ============================================================
    */

    function getFileType(name) {

        const parts = name.split(".");

        if (parts.length < 2)
            return "File";

        return parts.pop().toUpperCase() + " File";

    }


    /*
        ============================================================
        GO UP
        ============================================================
    */

    function goUp() {

        let path = window.location.pathname;

        if (path.endsWith("/")) {
            path = path.slice(0, -1);
        }

        const parent =
            path.substring(0, path.lastIndexOf("/") + 1);

        window.location.href = parent || "/";

    }


    /*
        ============================================================
        INITIALIZE
        ============================================================
    */

    renderFiles();

</script>

</body>
</html>
