<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thanks for your feedback! — VidPlayer HQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="vidplayer.css">
  <style>
    .thanks-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
    }
    .thanks-box {
      background: rgba(4,10,22,0.95);
      border: 1px solid var(--accent1);
      box-shadow: var(--glow-cyan);
      padding: 40px 50px;
      text-align: center;
      animation: panelIn 0.5s ease both;
    }
    .thanks-icon { font-size: 48px; margin-bottom: 16px; }
    .thanks-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--yellow);
      text-shadow: 0 0 16px rgba(255,224,102,0.5);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .thanks-box p { font-size: 14px; margin-bottom: 10px; }
  </style>
</head>
<body>
<canvas id="starfield"></canvas>
<div id="wrapper">
  <div id="header">
    <div id="header-grid"></div><div id="header-gfx"></div>
    <div id="header-inner">
      <div id="logo-area">
        <div id="logo-icon"><img src="logo.png" alt="VidPlayer Logo" onerror="this.style.display='none';this.parentElement.textContent='▶'"></div>
        <div id="logo-text"><h1>VIDPLAYER HQ</h1><div class="tagline">// FEEDBACK RECEIVED</div></div>
      </div>
      <div id="header-right">
        <div class="header-badges"><span class="hbadge hbadge-green">SENT ✓</span></div>
      </div>
    </div>
  </div>

  <div id="content" class="full">
    <div class="thanks-wrap">
      <div class="thanks-box">
        <div class="thanks-icon">📡</div>
        <div class="thanks-title">Message Received!</div>
        <p>Your VidPlayer feedback has been transmitted to the devs.</p>
        <p>We'll get back to you if needed — thanks for helping make VidPlayer better!</p>
        <div style="margin-top:20px">
          <a href="index.html" class="dl-btn">← Back to Home</a>
          <a href="downloads.html" class="dl-btn btn-secondary">Downloads →</a>
        </div>
      </div>
    </div>
  </div>

  <div id="footer">&copy; 2000–2025 VidPlayer Team &nbsp;·&nbsp; Sonic Fan Tech &amp; axel613</div>
</div>
<script src="vidplayer.js"></script>
</body>
</html>
